<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Socket.IO chat</title>
    <style>
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* Sidebar styles for the Online Roster */
      #sidebar {
        width: 200px;
        background: #e0e0e0;
        padding: 1rem;
        overflow-y: auto;
        border-right: 1px solid #ccc;
      }
      #sidebar h3 {
        margin-top: 0;
      }
      #roster {
        list-style-type: none;
        padding: 0;
        margin: 0;
      }
      #roster li {
        padding: 0.4rem 0;
        font-weight: bold;
        color: #333;
      }

      /* Main chat area styles */
      #main {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      #messages {
        list-style-type: none;
        margin: 0;
        padding: 0;
        flex-grow: 1;
        overflow-y: auto;
        padding-bottom: 4rem;
      }
      #messages > li {
        padding: 0.5rem 1rem;
      }
      #messages > li:nth-child(odd) {
        background: #efefef;
      }

      /* System messages and typing indicator styling */
      .system-msg {
        font-style: italic;
        color: #666;
        text-align: center;
        background: transparent !important;
      }
      #typing-indicator {
        position: absolute;
        bottom: 3.5rem;
        left: 1rem;
        font-style: italic;
        color: #888;
        height: 1.5rem;
      }

      /* Input form styles */
      #form {
        background: rgba(0, 0, 0, 0.15);
        padding: 0.25rem;
        display: flex;
        height: 3rem;
        box-sizing: border-box;
        backdrop-filter: blur(10px);
        position: absolute;
        bottom: 0;
        width: 100%;
      }
      #input {
        border: none;
        padding: 0 1rem;
        flex-grow: 1;
        border-radius: 2rem;
        margin: 0.25rem;
      }
      #input:focus {
        outline: none;
      }
      #form > button {
        background: #333;
        border: none;
        padding: 0 1rem;
        margin: 0.25rem;
        border-radius: 3px;
        outline: none;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <!-- Online Roster UI -->
    <div id="sidebar">
      <h3>Online Users</h3>
      <ul id="roster"></ul>
    </div>

    <div id="main">
      <ul id="messages"></ul>
      <div id="typing-indicator"></div>
      <form id="form" action="">
        <input id="input" autocomplete="off" /><button>Send</button>
      </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      // Prompt immediately upon loading to establish the user's identity
      let nickname = prompt("Please enter your nickname:") || "Anonymous";
      socket.emit("set nickname", nickname);

      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const messages = document.getElementById("messages");
      const roster = document.getElementById("roster");
      const typingIndicator = document.getElementById("typing-indicator");

      let typingTimeout;

      /**
       * Appends a new text node to the chat log.
       * Applies a specific CSS class if the message is a system notification.
       */
      function appendMessage(text, isSystem = false) {
        const item = document.createElement("li");
        item.textContent = text;

        if (isSystem) {
          item.className = "system-msg";
        }

        messages.appendChild(item);
        messages.scrollTo(0, messages.scrollHeight);
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        if (input.value) {
          // Immediately render the sender's own message locally for an optimistic UI
          appendMessage(`You: ${input.value}`);

          socket.emit("chat message", input.value);
          socket.emit("stop typing");
          input.value = "";
        }
      });

      input.addEventListener("input", () => {
        socket.emit("typing");
        clearTimeout(typingTimeout);

        // Automatically stop typing if the user pauses for 1 second
        typingTimeout = setTimeout(() => {
          socket.emit("stop typing");
        }, 1000);
      });

      // Listen for incoming messages from others
      socket.on("chat message", (data) => {
        appendMessage(`${data.username}: ${data.text}`);
      });

      // Listen for join/leave notifications
      socket.on("system message", (msg) => {
        appendMessage(msg, true);
      });

      // Listen for roster updates to populate the sidebar
      socket.on("roster update", (users) => {
        roster.innerHTML = "";

        users.forEach((user) => {
          const li = document.createElement("li");
          li.textContent = user;
          roster.appendChild(li);
        });
      });

      // Listen for typing events from other users
      socket.on("typing", (user) => {
        typingIndicator.textContent = `${user} is typing...`;
      });

      // Clear the typing indicator when the user stops
      socket.on("stop typing", () => {
        typingIndicator.textContent = "";
      });
    </script>
  </body>
</html>
